[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "katapult-helper"
version = "0.1.0"
description = "Batch-build and flash Klipper firmware via the Katapult bootloader"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
]

[project.scripts]
katapult-helper = "katapult_helper.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/katapult_helper"]
