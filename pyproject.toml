[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "katapult-helper"
version = "0.1.0"
description = "Batch-build and flash Klipper firmware via the Katapult bootloader"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "pyserial>=3.5",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
katapult-helper = "katapult_helper.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["katapult_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
